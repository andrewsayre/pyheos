name: CI

permissions:
  contents: read

on:
  push:
    branches: [ dev, main ]
  pull_request:

jobs:
  lint:
    name: "Check style, lint, and typing"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
        run: |
          uv pip install -r requirements.txt -r test-requirements.txt
      - name: Run checks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: "Run tests on ${{ matrix.python-version }}"
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
        run: uv pip install -r requirements.txt -r test-requirements.txt
      - name: Run pytest
        run: pytest --cov --cov-report=xml:coverage.xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload test results to Codecov
        if: ${{ always() && hashFiles('junit.xml') != '' }}
        uses: codecov/test-results-action@v1
        with:
          use_oidc: true
          files: ./junit.xml
          disable_search: true
          flags: py-${{ matrix.python-version }}
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.python-version == '3.13' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true
          disable_search: true